      - content: |-
          You are test_agent.

          You are a helpful test assistant for VCR cassette replay.
          <available-skills>
          <skill name="example-skill" description="A simple example skill that demonstrates the basic structure and functionality. Use when you need to show how skills work or test skill loading." />
          <skill name="openspec-apply-change" description="Implement tasks from an OpenSpec change. Use when the user wants to start implementing, continue implementation, or work through tasks." />
          <skill name="openspec-archive-change" description="Archive a completed change in the experimental workflow. Use when the user wants to finalize and archive a change after implementation is complete." />
          <skill name="openspec-explore" description="Enter explore mode - a thinking partner for exploring ideas, investigating problems, and clarifying requirements. Use when the user wants to think through something before or during a change." />
          <skill name="openspec-propose" description="Propose a new change with all artifacts generated in one step. Use when the user wants to quickly describe what they want to build and get a complete proposal with design, specs, and tasks ready for implementation." />
          </available-skills>
          You have access to resource management tools:
          - list_resources: List available resources from connected MCP servers and local files (paginated, use offset to page through)
          - read_resource: Read content from a resource by URI (supports text and binary content; large text is truncated)
          - resource_exists: Check if a resource exists
          - list_resource_templates: List URI templates for dynamic resource discovery (paginated, use offset to page through)
          - complete_resource_template: Get completion suggestions for template parameters

          URI schemes: mcp:// for MCP server resources, file:// for file-based resources
        role: system
      - content:
        - text: Say hello.
          type: text
        role: user
      model: svc/deepseek-v4-flash-0731
      stream: true
      stream_options:
        include_usage: true
      tool_choice: auto
      tools:
      - function:
          description: |-
            Load a skill's full instructions, activating its MCP servers and Python tools.

            Calling this tool loads the complete skill instructions (not the
            truncated resource-surface content) and activates the skill's
            declared MCP servers and Python tools, making them available for
            subsequent tool calls.

            Skill URI format:
            - ``skill://skill-name`` -- load by flat URI
            - ``skill://skill-name/references/file.md`` -- load a reference file
            - Bare name (e.g. ``python-expert``) -- backward compatible

            Argument substitution:
            - ``$1``, ``$2``, ... -- replaced with the Nth argument
            - ``$@`` -- replaced with all arguments
            - ``$ARGUMENTS`` -- replaced with all arguments
          name: load_skill
          parameters:
            additionalProperties: false
            properties:
              arguments:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                description: Optional space-separated arguments for substitution. Placeholders $1, $2, ... are replaced with
                  the Nth argument; $@ and $ARGUMENTS are replaced with all arguments.
              skill_name:
                description: Skill name or skill:// URI to load. Use a bare name (e.g. 'python-expert') or a skill:// URI
                  (e.g. 'skill://python-expert'). To load a reference file, use 'skill://skill-name/references/file.md'.
                type: string
            required:
            - skill_name
            type: object
        type: function
      - function:
          description: |-
            List all available skills with descriptions and URI information.

            Returns a formatted list of local and remote (MCP-provided) skills.
            Local skills are listed first, followed by remote skills discovered
            through child MCP capabilities. Remote skills are discovery-only --
            they are not auto-injected into system prompts.
          name: list_skills
          parameters:
            additionalProperties: false
            properties: {}
            type: object
        type: function
      - function:
          description: |-
            List available resources from connected MCP servers and local files.

            Results are paginated. Use ``offset`` to page through large result sets.
          name: list_resources
          parameters:
            additionalProperties: false
            properties:
              limit:
                default: 50
                description: 'Maximum number of resources to return (default: 50)'
                type: integer
              offset:
                default: 0
                description: Number of resources to skip for pagination
                type: integer
            type: object
        type: function
      - function:
          description: |-
            Read content from a resource by URI.

            Supports text and binary content. Routes by URI scheme; ``skill://``
            URIs are additionally resolved as a non-advertised fallback via
            ``resource_resolver.resolve_resource_content``.
          name: read_resource
          parameters:
            additionalProperties: false
            properties:
              uri:
                description: Resource URI to read, e.g. 'mcp://server/resource' or 'file://path/to/file'
                type: string
            required:
            - uri
            type: object
          strict: true
        type: function
      - function:
          description: |-
            <summary>Check if a resource exists.

            Routes by URI scheme:
            ``skill://`` → skill providers, other URIs → resource providers.</summary>
            <returns>
            <description>True if any provider has the resource, False otherwise.</description>
            </returns>
          name: resource_exists
          parameters:
            additionalProperties: false
            properties:
              uri:
                description: Resource URI to check
                type: string
            required:
            - uri
            type: object
          strict: true
        type: function
      - function:
          description: |-
            List URI templates for dynamic resource discovery.

            Results are paginated. Use ``offset`` to page through large result sets.
          name: list_resource_templates
          parameters:
            additionalProperties: false
            properties:
              limit:
                default: 50
                description: 'Maximum number of templates to return (default: 50)'
                type: integer
              offset:
                default: 0
                description: Number of templates to skip for pagination
                type: integer
            type: object
        type: function
      - function:
          description: Get completion suggestions for a resource template parameter.
          name: complete_resource_template
          parameters:
            additionalProperties: false
            properties:
              argument_name:
                description: The parameter name being completed
                type: string
              argument_value:
                description: The current value of the parameter
                type: string
              uri_template:
                description: The URI template to complete
                type: string
            required:
            - uri_template
            - argument_name
            - argument_value
            type: object
          strict: true
        type: function
